server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;

    # The React app is built with `base: '/petclinic/'` (vite.config.ts) and routed with
    # basename `/petclinic`, so every deep link must fall back to its index.html.
    location /petclinic/ {
        try_files $uri $uri/ /petclinic/index.html;
    }

    # Hashed Vite bundles: a missing asset must be a real 404, never index.html.
    location /petclinic/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = / {
        return 302 /petclinic/;
    }
}
