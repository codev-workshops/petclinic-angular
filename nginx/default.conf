server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;

    # The React app is built with `base: '/petclinic/'` (vite.config.ts) and routed with
    # basename `/petclinic`, so every deep link must fall back to its index.html.
    location /petclinic/ {
        try_files $uri $uri/ /petclinic/index.html;
    }

    location = / {
        return 302 /petclinic/;
    }
}
