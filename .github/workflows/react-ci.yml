name: React CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    services:
      petclinic-rest:
        image: springcommunity/spring-petclinic-rest
        ports:
          - 9966:9966
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:9966/petclinic/api/pettypes >/dev/null && exit 0
            sleep 2
          done
          echo "backend did not become ready" >&2
          exit 1
      - name: Playwright parity suite
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-react
          path: |
            e2e/.tmp/test-results
            e2e/__screenshots__/react
          retention-days: 7
